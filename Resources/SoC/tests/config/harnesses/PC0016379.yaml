devices:
  efr_brd4180a:
    type: 'efx32'
    subtype: 'brd4180a'
    defaults:
      cli_transport: 'serial'
    # The 'interfaces' attribute is mandatory to describe the control interfaces/functionality of the device
    interfaces:
      serial:
        type: 'serial'
        port: 'COM4'
        baud: 921600
      wifi:
        type: 'sl_wifi_test_agent_cli'
        src_dir: 'tests'
      reset:
        type: 'reset.commander'
  brd4338a:
    type: 'si91x'
    subtype: 'brd4338a'
    src_dir: ''
    defaults:
      cli_transport: 'serial'
    # The 'interfaces' attribute is mandatory to describe the control interfaces/functionality of the device
    interfaces:
      serial:
        type: 'serial'
        port: 'COM3'
        baud: 115200
      wifi:
        type: 'sl_wifi_test_agent_cli'
        src_dir: 'tests'
      bluetooth: '.wifi'
      reset:
        type: 'reset.commander'
  guest_ap:
    interfaces:
      wifi:
        type: 'wifi.access_points.static'
        ssid: 'YOUR_AP_SSID'
        passphrase: 'YOUR_AP_PASSPHRASE'
        security: 'wpa2'
        supports: 'wifi_ap'
        channel: 1
  test_nuc:
    interfaces:
      network:
        type: 'network.linux'
        interface: 'eno1'
      local_shell:
        type: 'shell.ssh_shell'
        remote: '192.168.1.12'
        username: 'silabs'
        password: 'itsquitesimple'
      iperf:
        type: 'iperf.executable_iperf'
      bluetooth:
        type: 'bluetooth.bluez'
        adapter_name: 'hci0'
      wifi:
        type: 'wifi.access_points.linux'
        ssid: 'nuc_test_ap'
        passphrase: 'YOUR_AP_PASSPHRASE'
        security: 'wpa2'
        supports: 'wifi_ap'
        channel: 6
        interface: 'wlp58s0'
    defaults:
      shell: 'local_shell'

  localhost:
    interfaces:
      socket:
        type: 'socket.local'
      network:
        type: 'network.windows'
        interface: 'Ethernet'
      localshell:
        type: 'shell.shell'
    defaults:
      network: 'network'
      shell: 'localshell'

  dummy_sniffer:
    interfaces:
      capture:
        type: 'wifi.sniffer.dummy_sniffer'
defaults:
  wifi:
    ssid: 'YOUR_AP_SSID'
    passphrase: 'YOUR_AP_PASSPHRASE'
    security: 'wpa2'
    channel: 1

  wifi_dut: 'brd4338a'
  ble_dut: 'brd4338a'
  ble_client: 'test_nuc'
  wifi_access_point: 'guest_ap'
  iperf_server: 'test_nuc'
  wifi_sniffer: 'dummy_sniffer'
  socket_server: 'localhost'

path:
  - '/silabs/.yakka/repos/commander/windows'
