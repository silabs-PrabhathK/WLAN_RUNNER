devices:
  efr_brd4180a:
    type: 'efx32'
    subtype: 'brd4180a'
    defaults:
      cli_transport: 'serial'
    # The 'interfaces' attribute is mandatory to describe the control interfaces/functionality of the device
    interfaces:
      serial:
        type: 'serial'
        port: '/dev/tty.usbmodem0004401435611'
      wifi:
          type: 'sl_wifi_test_agent_cli'
          src_dir: 'tests'
  guest_ap:
    interfaces:
      wifi:
        type: 'wifi.access_points.static'
        ssid: 'YOUR_AP_SSID'
        passphrase: 'YOUR_AP_PASSPHRASE'
        security: 'wpa2'
        supports: 'wifi_ap'
        channel: 1

defaults:
  wifi:
    ssid: 'YOUR_AP_SSID'
    passphrase: 'YOUR_AP_PASSPHRASE'
    security: 'wpa2'
    channel: 1

  wifi_dut: 'efr_brd4180a'
  wifi_access_point: 'guest_ap'
