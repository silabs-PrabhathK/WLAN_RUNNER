devices:
  efr_brd4180b:
    type: 'efx32'
    subtype: 'brd4180b'
    defaults:
      cli_transport: 'serial'
    # The 'interfaces' attribute is mandatory to describe the control interfaces/functionality of the device
    interfaces:
      serial:
        type: 'serial'
        port: 'COM14'
      wifi:
          type: 'sl_wifi_test_agent_cli'
          src_dir: 'tests'
  Access_point:
    interfaces:
      wifi:
        type: 'wifi.access_points.static'
        ssid: 'hotspot1'
        passphrase: '77778888'
        security: 'wpa2'
      # supports: 'wifi_ap'

defaults:
  wifi:
    ssid: 'WiFiSDK'
    passphrase: ' wifisdk@2022'
    security: 'wpa2'
  # channel: 5

  wifi_enterprise:
    ssid: 'enterprise'
    username: 'user1'
    passphrase: 'password1'

  wifi_dut: 'efr_brd4180b'
  wifi_access_point: 'Access_point'

